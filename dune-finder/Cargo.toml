[package]
name = "dune-finder"
version = "0.1.0"
edition = "2024"
description = "The launcher, window switcher and file finder of the dune compositor"

[dependencies]
dune-common = { path = "../dune-common" }
nucleo-matcher = "0.3.1"
resvg = { version = "0.48.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1.0.154"
smithay-client-toolkit = "0.21"
toml = "1.1.8"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
ureq = { version = "3.5.0", default-features = false }
