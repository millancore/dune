# Portal backends for XDG_CURRENT_DESKTOP=dune (like sway's): screen sharing and
# screenshots through xdg-desktop-portal-wlr, which uses dune's
# ext-image-copy-capture; the rest through the GTK portal.
# Install to ~/.config/xdg-desktop-portal/ or /usr/share/xdg-desktop-portal/.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
# The GTK portal's Inhibit needs org.gnome.SessionManager, which dune does not have.
org.freedesktop.impl.portal.Inhibit=none
