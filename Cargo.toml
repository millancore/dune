[workspace]
members = ["dune-common", "dune-finder"]

[package]
name = "dune"
version = "0.1.0"
edition = "2024"
description = "A terminal-first tiling Wayland compositor built on Smithay"
default-run = "dune"

[dependencies]
dune-common = { path = "dune-common" }
glam = { version = "0.33.2", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
toml = "1.1.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
xcursor = "0.3"

[dependencies.smithay-drm-extras]
git = "https://github.com/Smithay/smithay"
rev = "023b78b1c5a05ca512767cacc07efca55fae8be4"

[dependencies.smithay]
git = "https://github.com/Smithay/smithay"
rev = "023b78b1c5a05ca512767cacc07efca55fae8be4"
default-features = false
features = ["backend_winit", "backend_drm", "backend_gbm", "backend_udev", "backend_libinput", "backend_session_libseat", "wayland_frontend", "desktop"]

[dependencies.nix]
version = "0.31"
features = ["term", "process", "signal", "poll", "fs"]

[dependencies.libc]
version = "0.2"
